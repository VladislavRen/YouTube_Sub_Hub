[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-sub-hub"
version = "0.1.0"
description = "Local-first YouTube to scientific Markdown notes and Neo4j knowledge graph service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.159.1,<1",
  "uvicorn[standard]>=0.54,<1",
  "typer>=0.27.3,<1",
  "youtube-transcript-api>=1.2.4,<2",
  "yt-dlp[default]>=2026.10.21",
  "openai-whisper>=20250625",
  # BeeAI/LiteLLM currently require the compatible OpenAI SDK 2.x line.
  "openai>=2.54,<3",
  "httpx>=0.28.1,<1",
  "ddgs>=9.16,<10",
  "neo4j>=6.4.1,<7",
  "python-dotenv>=1.2.4,<2",
  "google-api-python-client>=2.201,<3",
  "google-auth[requests]>=2.62,<3",
  "google-auth-httplib2>=0.4.4,<1",
  "google-auth-oauthlib>=1.5,<2",
  "httplib2>=0.32,<1",
  # httplib2 silently skips configured proxies without its optional socket transport.
  "PySocks>=1.7.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10"]
beeai = ["beeai-framework>=0.1.85,<1"]

[project.scripts]
yt-sub-hub = "yt_sub_hub.cli:app"
yt-sub-hub-auth = "yt_sub_hub.youtube_oauth:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
