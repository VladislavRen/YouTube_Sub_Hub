[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-sub-hub"
version = "0.1.0"
description = "Local-first YouTube to scientific Markdown notes and Neo4j knowledge graph service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2025.1.1",
  "openai-whisper>=20240930",
  "openai>=1.60",
  "httpx>=0.28",
  "ddgs>=9.14.2",
  "neo4j>=5.28",
  "python-dotenv>=1.0",
  "google-api-python-client>=2.195",
  "google-auth-httplib2>=0.3",
  "google-auth-oauthlib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]
beeai = ["beeai-framework>=0.1,<1"]

[project.scripts]
yt-sub-hub = "yt_sub_hub.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
