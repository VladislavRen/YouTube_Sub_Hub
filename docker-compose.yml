services:
  neo4j:
    image: neo4j:5.26.32-community@sha256:eaee4488d580749ce332bd028f5be3917edf91f562d76c5443a51c08ec347b1f
    container_name: yt-sub-hub-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${YT_SUB_HUB_NEO4J_USER:-neo4j}/${YT_SUB_HUB_NEO4J_PASSWORD:?Set your own Neo4j password in .env}"
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
